
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
      <title>Bizqwik - Client</title>

      <meta name="robots" content="noindex, nofollow" />
      <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no" />
      <meta name="theme-color" content="#ffffff" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="default" />
      <meta name="apple-mobile-web-app-title" content="Bizqwik" />
      <meta name="msapplication-tap-highlight" content="no" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }
        #bq-boot { height: 100%; display: flex; align-items: center; justify-content: center; background: #fff; }
        #bq-boot span { width: 40px; height: 40px; border-radius: 50%; border: 4px solid #e5e7eb; border-top-color: var(--bq-primary, #5a41ff); animation: bq-spin 0.8s linear infinite; }
        @keyframes bq-spin { to { transform: rotate(360deg); } }
      </style>
      <!-- Paint the gym's colours from the very first frame (saved on the last visit). -->
      <script>
        try {
          var t = JSON.parse(localStorage.getItem("bq:theme") || "null");
          if (t) for (var k in t) document.documentElement.style.setProperty(k, t[k]);
        } catch (e) {}
      </script>
      <!-- Start connecting to the backend and the font host while the app loads. -->
      <link rel="preconnect" href="https://aylhnxniqrihpvrllpgz.supabase.co" crossorigin />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <!-- The mono font never blocks the first paint; text swaps to it when it arrives. -->
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'" />
      
    </head>

    <body>
      
      <div id="root"><div id="bq-boot"><span></span></div></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
